# netlify.toml
# Netlify Base directory: apps
#
# Directory layout after build:
#   ../dist/
#     public/    ← public.sarangpatel.tech
#     admin/     ← admin.sarangpatel.tech
#     customer/  ← customer.sarangpatel.tech
#
# Netlify serves ../dist as the publish root. Domain-level rewrite rules below
# map each hostname to the correct subfolder and SPA shell.

[build]
  # Run from the apps directory and build all 3 frontends
  command = "npm install --prefix public && npm install --prefix admin && npm install --prefix customer && npm run build --prefix public && npm run build --prefix admin && npm run build --prefix customer && node ../scripts/post-build.js"
  publish = "../dist"

[build.environment]
  NODE_VERSION = "20"

# admin.sarangpatel.tech static assets under /admin/*
[[redirects]]
  from   = "https://admin.sarangpatel.tech/admin/*"
  to     = "/admin/:splat"
  status = 200

# admin.sarangpatel.tech app shell
[[redirects]]
  from   = "https://admin.sarangpatel.tech/*"
  to     = "/admin/index.html"
  status = 200

# customer.sarangpatel.tech static assets under /customer/*
[[redirects]]
  from   = "https://customer.sarangpatel.tech/customer/*"
  to     = "/customer/:splat"
  status = 200

# customer.sarangpatel.tech app shell
[[redirects]]
  from   = "https://customer.sarangpatel.tech/*"
  to     = "/customer/index.html"
  status = 200

# public.sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://public.sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# public.sarangpatel.tech app shell
[[redirects]]
  from   = "https://public.sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

# sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# sarangpatel.tech app shell
[[redirects]]
  from   = "https://sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

# www.sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://www.sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# www.sarangpatel.tech app shell
[[redirects]]
  from   = "https://www.sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
