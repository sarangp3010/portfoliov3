# netlify.toml
# Netlify Base directory: apps
#
# Directory layout after build:
#   ../dist/
#     public/    ← public.sarangpatel.tech
#     admin/     ← admin.sarangpatel.tech
#     customer/  ← customer.sarangpatel.tech
#
# Netlify serves ../dist as the publish root. Subdomain rewrite rules below
# transparently rewrite each subdomain to its subfolder.

[build]
  # Run from the apps directory and build all 3 frontends
  command = "npm install --prefix public && npm install --prefix admin && npm install --prefix customer && npm run build --prefix public && npm run build --prefix admin && npm run build --prefix customer && node ../scripts/post-build.js"
  publish = "../dist"

[build.environment]
  NODE_VERSION = "20"

# admin.sarangpatel.tech static assets under /admin/*
[[redirects]]
  from    = "/admin/*"
  to      = "/admin/:splat"
  status  = 200
  conditions = { Host = ["admin.sarangpatel.tech"] }

# admin.sarangpatel.tech app shell
[[redirects]]
  from    = "/*"
  to      = "/admin/index.html"
  status  = 200
  conditions = { Host = ["admin.sarangpatel.tech"] }

# customer.sarangpatel.tech static assets under /customer/*
[[redirects]]
  from    = "/customer/*"
  to      = "/customer/:splat"
  status  = 200
  conditions = { Host = ["customer.sarangpatel.tech"] }

# customer.sarangpatel.tech app shell
[[redirects]]
  from    = "/*"
  to      = "/customer/index.html"
  status  = 200
  conditions = { Host = ["customer.sarangpatel.tech"] }

# public.sarangpatel.tech static assets under /public/*
[[redirects]]
  from    = "/public/*"
  to      = "/public/:splat"
  status  = 200
  conditions = { Host = ["public.sarangpatel.tech", "sarangpatel.tech", "www.sarangpatel.tech"] }

# public.sarangpatel.tech and apex app shell
[[redirects]]
  from    = "/*"
  to      = "/public/index.html"
  status  = 200
  conditions = { Host = ["public.sarangpatel.tech", "sarangpatel.tech", "www.sarangpatel.tech"] }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
