# netlify.toml
# Root-level Netlify config for the monorepo build.
#
# If Netlify is configured with `apps` as the package/base directory, it may
# use `apps/netlify.toml` instead. Keep both files aligned so the effective
# routing stays the same regardless of which config Netlify resolves.
#
# Directory layout after build:
#   dist/
#     public/    ← public.sarangpatel.tech
#     admin/     ← admin.sarangpatel.tech
#     customer/  ← customer.sarangpatel.tech
#
# Netlify serves `dist/` as the publish root. Host-based rewrite rules below
# map each domain to the correct subfolder.

[build]
  # Run from repo root — installs all workspaces then builds all 3 apps
  command = "npm install --prefix apps/public && npm install --prefix apps/admin && npm install --prefix apps/customer && npm run build:all"
  publish = "dist"

# ── Environment variables (set real values in Netlify UI, not here) ──────────
# These are safe defaults/placeholders. Override in Netlify dashboard.
[build.environment]
  NODE_VERSION = "20"

# ── Subdomain routing ─────────────────────────────────────────────────────────
# Netlify matches redirects by path, with host-specific conditions layered on
# top. Static asset rules come before SPA shell fallbacks.

# admin.sarangpatel.tech static assets under /admin/*
[[redirects]]
  from    = "/admin/*"
  to      = "/admin/:splat"
  status  = 200
  conditions = { Host = ["admin.sarangpatel.tech"] }

# admin.sarangpatel.tech app shell
[[redirects]]
  from    = "/*"
  to      = "/admin/index.html"
  status  = 200
  conditions = { Host = ["admin.sarangpatel.tech"] }

# customer.sarangpatel.tech static assets under /customer/*
[[redirects]]
  from    = "/customer/*"
  to      = "/customer/:splat"
  status  = 200
  conditions = { Host = ["customer.sarangpatel.tech"] }

# customer.sarangpatel.tech app shell
[[redirects]]
  from    = "/*"
  to      = "/customer/index.html"
  status  = 200
  conditions = { Host = ["customer.sarangpatel.tech"] }

# public.sarangpatel.tech static assets under /public/*
[[redirects]]
  from    = "/public/*"
  to      = "/public/:splat"
  status  = 200
  conditions = { Host = ["public.sarangpatel.tech", "sarangpatel.tech", "www.sarangpatel.tech"] }

# public.sarangpatel.tech and apex app shell
[[redirects]]
  from    = "/*"
  to      = "/public/index.html"
  status  = 200
  conditions = { Host = ["public.sarangpatel.tech", "sarangpatel.tech", "www.sarangpatel.tech"] }

# ── Security headers for all responses ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
