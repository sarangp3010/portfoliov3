# netlify.toml
# Root-level Netlify config for the monorepo build.
#
# If Netlify is configured with `apps` as the package/base directory, it may
# use `apps/netlify.toml` instead. Keep both files aligned so the effective
# routing stays the same regardless of which config Netlify resolves.
#
# Directory layout after build:
#   dist/
#     public/    ← public.sarangpatel.tech
#     admin/     ← admin.sarangpatel.tech
#     customer/  ← customer.sarangpatel.tech
#
# Netlify serves `dist/` as the publish root. Domain-level rewrite rules below
# map each hostname to the correct subfolder and SPA shell.

[build]
  # Run from repo root — installs all workspaces then builds all 3 apps
  command = "npm install --prefix apps/public && npm install --prefix apps/admin && npm install --prefix apps/customer && npm run build:all"
  publish = "dist"

# ── Environment variables (set real values in Netlify UI, not here) ──────────
# These are safe defaults/placeholders. Override in Netlify dashboard.
[build.environment]
  NODE_VERSION = "20"

# ── Subdomain routing ─────────────────────────────────────────────────────────
# Static asset rewrites must come before SPA shell fallbacks.

# admin.sarangpatel.tech static assets under /admin/*
[[redirects]]
  from   = "https://admin.sarangpatel.tech/admin/*"
  to     = "/admin/:splat"
  status = 200

# admin.sarangpatel.tech app shell
[[redirects]]
  from   = "https://admin.sarangpatel.tech/*"
  to     = "/admin/index.html"
  status = 200

# customer.sarangpatel.tech static assets under /customer/*
[[redirects]]
  from   = "https://customer.sarangpatel.tech/customer/*"
  to     = "/customer/:splat"
  status = 200

# customer.sarangpatel.tech app shell
[[redirects]]
  from   = "https://customer.sarangpatel.tech/*"
  to     = "/customer/index.html"
  status = 200

# public.sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://public.sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# public.sarangpatel.tech app shell
[[redirects]]
  from   = "https://public.sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

# sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# sarangpatel.tech app shell
[[redirects]]
  from   = "https://sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

# www.sarangpatel.tech static assets under /public/*
[[redirects]]
  from   = "https://www.sarangpatel.tech/public/*"
  to     = "/public/:splat"
  status = 200

# www.sarangpatel.tech app shell
[[redirects]]
  from   = "https://www.sarangpatel.tech/*"
  to     = "/public/index.html"
  status = 200

# ── Security headers for all responses ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
